# Native shell builds (mac=Swift, Windows=Tauri).
# 기존 build.yml(Electron 릴리스)·deploy.yml(웹 배포)과 완전 분리 —
# 이 워크플로우의 실패는 main 릴리스/배포에 영향을 주지 않는다.
# 초기에는 수동 트리거만 사용한다. 안정화 후 v* 태그 트리거 편입 검토
# (native support plan.md 11장).
name: Native Builds

on:
  workflow_dispatch: {}

jobs:
  mac-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build native macOS app
        run: bash native/scripts/build-mac-native-app.sh

      - name: Zip .app bundle
        run: cd release && zip -ry "Hi-MD-Power-mac.zip" "Hi MD Power.app"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-native-app
          path: release/Hi-MD-Power-mac.zip

  win-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './native/windows/src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Tauri CLI
        run: npm ci
        working-directory: native/windows

      - name: Build Windows native installer (NSIS)
        run: npm run build
        working-directory: native/windows

      - uses: actions/upload-artifact@v4
        with:
          name: win-native-installer
          path: native/windows/src-tauri/target/release/bundle/nsis/*.exe
