name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 코드 서명 없이 빌드
        run: npm run build:mac

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.dmg
