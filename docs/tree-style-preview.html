<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Tree Style Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f0ede8; padding: 32px; display: flex; gap: 20px; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 12px; padding: 20px; width: 220px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card h3 { font-size: 12px; color: #999; margin-bottom: 14px; text-transform: uppercase; letter-spacing: .05em; }
  .tree { display: flex; flex-direction: column; gap: 1px; }
  .node { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; user-select: none; }
  .node svg { flex-shrink: 0; }
  .chevron { opacity: .5; }

  /* ── A: Color ── */
  .a .folder { color: #3a7040; font-weight: 600; }
  .a .file   { color: #3d3d3a; }
  .a .folder:hover { background: #f0faf2; }
  .a .file:hover   { background: #f5f4f0; }

  /* ── B: Background bar ── */
  .b .folder { background: #f5f4f0; border-left: 3px solid #82c982; color: #2e4a2e; font-weight: 600; padding-left: 6px; }
  .b .file   { color: #5f5e5a; padding-left: 11px; }
  .b .folder:hover { background: #ece9e3; }
  .b .file:hover   { background: #f5f4f0; }

  /* ── C: Icon color ── */
  .c .node { color: #3d3d3a; }
  .c .folder-icon { color: #e8a020; }
  .c .file-icon   { color: #82c982; }
  .c .node:hover  { background: #f5f4f0; }

  /* ── D: Typography ── */
  .d .folder { font-size: 12.5px; font-weight: 600; color: #1a1a18; letter-spacing: .02em; }
  .d .file   { font-size: 11.5px; font-weight: 400; color: #8a8a86; }
  .d .folder:hover { background: #f5f4f0; }
  .d .file:hover   { background: #f5f4f0; }

  /* ── E: Combo (B+C+D) ── */
  .e .folder { background: #f5f4f0; border-left: 3px solid #82c982; color: #2e4a2e; font-size: 12.5px; font-weight: 600; padding-left: 6px; letter-spacing: .02em; }
  .e .folder .folder-icon { color: #e8a020; }
  .e .file   { color: #6b6b68; font-size: 11.5px; padding-left: 11px; }
  .e .file .file-icon { color: #82c982; }
  .e .folder:hover { background: #ece9e3; }
  .e .file:hover   { background: #f5f4f0; }

  .indent { padding-left: 22px !important; }
  .badge { font-size: 9px; background: #e8f5e9; color: #3a7040; border-radius: 3px; padding: 1px 4px; margin-left: auto; font-weight: 600; }
</style>
</head>
